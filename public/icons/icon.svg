<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#15803D" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background with safe-padding for maskable icon -->
  <rect width="512" height="512" rx="112" fill="url(#primaryGrad)"/>
  
  <!-- Subtle decorative ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="8"/>

  <!-- Main Emblem: Civic hand/shield holding community leaf & community buildings -->
  <g filter="url(#shadow)" fill="#FFFFFF">
    <!-- Center Civic Pillar / Emblem -->
    <path d="M256 100 L350 160 V280 C350 350 256 405 256 405 C256 405 162 350 162 280 V160 Z" fill="#FFFFFF"/>
    <!-- Inner Accent: Civic Hands & Sprout -->
    <path d="M256 150 L320 190 V270 C320 315 256 360 256 360 C256 360 192 315 192 270 V190 Z" fill="#16A34A"/>
    <!-- Core Sprout / Checkmark representing citizen resolution -->
    <path d="M235 260 L250 275 L285 235" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="256" cy="210" r="14" fill="#FFFFFF"/>
  </g>
</svg>
